# Nome del workflow
name: Test Standard per Applicazioni Python (solo Pip)

# Il workflow si attiva su push e pull request sul branch principale
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test_e_build:
    runs-on: ubuntu-latest
    
    # Esegue i test su più versioni di Python
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout del Codice
      uses: actions/checkout@v4
      
    - name: Configura Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' 

    - name: Installa le Dipendenze
      run: |
        python -m pip install --upgrade pip
        # Installa pytest per i test
        pip install pytest flake8 
        
        # Installa le dipendenze del progetto dal tuo requirements.txt
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "ATTENZIONE: requirements.txt non trovato."
        fi

    - name: Linting con Flake8
      run: |
        # Esegue il linting (controllo dello stile del codice)
        flake8 . --count --exit-zero --max-line-length=127 --statistics

    - name: Esegui i Test
      run: |
        pytest
